[project]
name = "motioncapture"
version = "0.1.0"
description = "Cross-platform camera-based markerless motion capture prototypes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi>=2026.7.22",
  "mediapipe==0.10.31",
  "numpy>=2.0,<3",
  "opencv-contrib-python>=4.12,<5",
]

[project.scripts]
motioncapture-demo = "motioncapture.app:main"
motioncapture-models = "motioncapture.model_assets:main"
motioncapture-avatars = "motioncapture.avatar_assets:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motioncapture"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
